name: Deploy Ranger Guide to Pages

on:
  push:
    branches: ["ranger-guide-20260930"]
    paths:
      - "ranger-guide-site/**"
      - ".github/workflows/ranger-guide-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ranger-guide-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ranger-guide-20260930
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ranger-guide-site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
